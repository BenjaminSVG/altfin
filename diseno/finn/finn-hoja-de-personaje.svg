<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860">
  <title>Finn - hoja de personaje (AltFin)</title>
  <defs>
    <radialGradient id="body" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#7BE0B2"/>
      <stop offset="0.55" stop-color="#2FB67C"/>
      <stop offset="1" stop-color="#1F8F5F"/>
    </radialGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="1" stop-color="#E8A317"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1F3A2E" flood-opacity="0.22"/>
    </filter>

    <!-- Cuerpo base: pies + bola + costura + brillo + moneda-brote -->
    <symbol id="feet" overflow="visible">
      <ellipse cx="-42" cy="100" rx="26" ry="17" fill="#1F8F5F"/>
      <ellipse cx="42" cy="100" rx="26" ry="17" fill="#1F8F5F"/>
    </symbol>
    <symbol id="ball" overflow="visible">
      <circle r="100" fill="url(#body)" filter="url(#shadow)"/>
      <path d="M-70 -62 A100 100 0 0 1 20 -98" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
      <path d="M-86 52 A100 100 0 0 0 86 52" fill="none" stroke="#1F8F5F" stroke-opacity=".55" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>
    </symbol>
    <symbol id="sprout" overflow="visible">
      <path d="M0 -98 Q-4 -112 0 -120" stroke="#1F8F5F" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="-132" r="17" fill="url(#coin)" stroke="#C98700" stroke-width="3"/>
      <text x="0" y="-126" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="800" fill="#C98700" text-anchor="middle">$</text>
    </symbol>
    <symbol id="cheeks" overflow="visible">
      <ellipse cx="-58" cy="22" rx="14" ry="9" fill="#FF8FA3" opacity=".7"/>
      <ellipse cx="58" cy="22" rx="14" ry="9" fill="#FF8FA3" opacity=".7"/>
    </symbol>
    <symbol id="eyes-open" overflow="visible">
      <circle cx="-32" cy="-6" r="13" fill="#24313A"/><circle cx="32" cy="-6" r="13" fill="#24313A"/>
      <circle cx="-28" cy="-11" r="5" fill="#fff"/><circle cx="36" cy="-11" r="5" fill="#fff"/>
      <circle cx="-37" cy="0" r="2.5" fill="#fff"/><circle cx="27" cy="0" r="2.5" fill="#fff"/>
    </symbol>
  </defs>

  <rect width="1080" height="860" fill="#FFF4E0"/>
  <text x="540" y="52" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="800" fill="#1F3A2E" text-anchor="middle">Finn · mascota de AltFin</text>
  <text x="540" y="82" font-family="Nunito, Arial, sans-serif" font-size="18" fill="#5B6B63" text-anchor="middle">Peluche circular, verde menta, con una moneda-brote en la cabeza</text>

  <!-- 1. FELIZ -->
  <g transform="translate(180,290)">
    <use href="#feet"/>
    <ellipse cx="-104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(-25 -104 14)"/>
    <ellipse cx="104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(25 104 14)"/>
    <use href="#ball"/><use href="#sprout"/><use href="#cheeks"/><use href="#eyes-open"/>
    <path d="M-20 22 Q0 44 20 22" fill="none" stroke="#24313A" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="190" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A2E" text-anchor="middle">Feliz · dentro del presupuesto</text>
  </g>

  <!-- 2. CELEBRANDO -->
  <g transform="translate(540,290)">
    <use href="#feet"/>
    <ellipse cx="-100" cy="-50" rx="14" ry="22" fill="#1F8F5F" transform="rotate(-30 -100 -50)"/>
    <ellipse cx="100" cy="-50" rx="14" ry="22" fill="#1F8F5F" transform="rotate(30 100 -50)"/>
    <use href="#ball"/><use href="#sprout"/><use href="#cheeks"/>
    <path d="M-45 -4 Q-32 -24 -19 -4" fill="none" stroke="#24313A" stroke-width="6" stroke-linecap="round"/>
    <path d="M19 -4 Q32 -24 45 -4" fill="none" stroke="#24313A" stroke-width="6" stroke-linecap="round"/>
    <path d="M-26 16 Q0 62 26 16 Z" fill="#24313A"/>
    <path d="M-14 34 Q0 46 14 34 Q0 28 -14 34 Z" fill="#FF8FA3"/>
    <g>
      <rect x="-150" y="-130" width="10" height="16" rx="2" fill="#FF9F43" transform="rotate(25 -150 -130)"/>
      <rect x="-120" y="-165" width="10" height="16" rx="2" fill="#4DA3FF" transform="rotate(-20 -120 -165)"/>
      <rect x="130" y="-140" width="10" height="16" rx="2" fill="#FF6B8A" transform="rotate(35 130 -140)"/>
      <rect x="100" y="-170" width="10" height="16" rx="2" fill="#FFD23F" transform="rotate(-30 100 -170)"/>
      <circle cx="-160" cy="-60" r="6" fill="#FFD23F"/><circle cx="165" cy="-70" r="6" fill="#4DA3FF"/>
      <circle cx="-60" cy="-185" r="5" fill="#FF6B8A"/><circle cx="60" cy="-190" r="5" fill="#FF9F43"/>
    </g>
    <text x="0" y="190" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A2E" text-anchor="middle">Celebrando · meta o racha</text>
  </g>

  <!-- 3. PENSATIVO -->
  <g transform="translate(900,290)">
    <use href="#feet"/>
    <ellipse cx="-104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(-25 -104 14)"/>
    <use href="#ball"/><use href="#sprout"/><use href="#cheeks"/>
    <circle cx="-30" cy="-10" r="13" fill="#24313A"/><circle cx="34" cy="-10" r="13" fill="#24313A"/>
    <circle cx="-26" cy="-16" r="5" fill="#fff"/><circle cx="38" cy="-16" r="5" fill="#fff"/>
    <path d="M-48 -34 Q-32 -42 -16 -34" fill="none" stroke="#24313A" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 -38 Q32 -48 48 -38" fill="none" stroke="#24313A" stroke-width="4" stroke-linecap="round"/>
    <path d="M-10 30 Q4 26 16 32" fill="none" stroke="#24313A" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="52" cy="62" rx="15" ry="12" fill="#2FB67C" stroke="#14704A" stroke-width="2.5"/>
    <text x="70" y="-110" font-family="Nunito, Arial, sans-serif" font-size="48" font-weight="800" fill="#FF9F43">?</text>
    <text x="0" y="190" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A2E" text-anchor="middle">Pensativo · gasto grande</text>
  </g>

  <!-- 4. PREOCUPADO -->
  <g transform="translate(180,700) scale(.9)">
    <use href="#feet"/>
    <ellipse cx="-104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(-25 -104 14)"/>
    <ellipse cx="104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(25 104 14)"/>
    <use href="#ball"/><use href="#sprout"/><use href="#cheeks"/><use href="#eyes-open"/>
    <path d="M-50 -24 L-18 -38" stroke="#24313A" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 -24 L18 -38" stroke="#24313A" stroke-width="5" stroke-linecap="round"/>
    <path d="M-22 36 Q-11 26 0 36 Q11 46 22 36" fill="none" stroke="#24313A" stroke-width="5" stroke-linecap="round"/>
    <path d="M78 -50 Q92 -26 78 -16 Q64 -26 78 -50 Z" fill="#7CC4FF" stroke="#4DA3FF" stroke-width="2"/>
    <text x="0" y="170" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A2E" text-anchor="middle">Preocupado (suave) · cerca del límite</text>
  </g>

  <!-- 5. DORMIDO -->
  <g transform="translate(540,700) scale(.9)">
    <use href="#feet"/>
    <ellipse cx="-104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(-25 -104 14)"/>
    <ellipse cx="104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(25 104 14)"/>
    <use href="#ball"/><use href="#sprout"/><use href="#cheeks"/>
    <path d="M-46 -4 Q-32 8 -18 -4" fill="none" stroke="#24313A" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 -4 Q32 8 46 -4" fill="none" stroke="#24313A" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="0" cy="34" rx="8" ry="6" fill="#24313A"/>
    <text x="84" y="-70" font-family="Nunito, Arial, sans-serif" font-size="40" font-weight="800" fill="#4DA3FF">Z</text>
    <text x="112" y="-104" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="800" fill="#4DA3FF">z</text>
    <text x="0" y="170" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A2E" text-anchor="middle">Dormido · fuera de horario</text>
  </g>

  <!-- 6. RICO -->
  <g transform="translate(900,700) scale(.9)">
    <use href="#feet"/>
    <ellipse cx="-104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(-25 -104 14)"/>
    <ellipse cx="104" cy="14" rx="20" ry="14" fill="#1F8F5F" transform="rotate(25 104 14)"/>
    <use href="#ball"/><use href="#cheeks"/><use href="#eyes-open"/>
    <path d="M-20 22 Q0 44 20 22" fill="none" stroke="#24313A" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="-6" r="24" fill="#fff" fill-opacity=".25" stroke="#E8A317" stroke-width="4"/>
    <path d="M44 14 Q60 40 52 64" fill="none" stroke="#E8A317" stroke-width="3"/>
    <rect x="-52" y="-112" width="104" height="14" rx="6" fill="#24313A"/>
    <rect x="-34" y="-168" width="68" height="62" rx="8" fill="#24313A"/>
    <rect x="-34" y="-124" width="68" height="12" fill="#E8A317"/>
    <text x="0" y="170" font-family="Nunito, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F3A2E" text-anchor="middle">Rico · nivel alto (Magnate)</text>
  </g>
</svg>
